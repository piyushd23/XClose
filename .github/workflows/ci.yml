name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle (arm64, ad-hoc signed)
        run: ARCHS=arm64 scripts/build-app.sh
