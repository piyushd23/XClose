name: Website

# Publishes site/ (landing page and Sparkle appcast) to GitHub Pages.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # When called from a release, the new appcast entry is on main, not the tag.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
