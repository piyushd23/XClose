name: Release

# Push a tag like v1.0.0 (matching Resources/Info.plist) to publish a release.
# Required secrets:
#   SPARKLE_PRIVATE_KEY    contents of ~/.xclose-release/sparkle_ed25519.key
#   SIGNING_P12_BASE64     base64 of the signing .p12 (self-signed now, Developer ID later)
#   SIGNING_P12_PASSWORD   its password
# Optional, once you have a Developer ID (enables notarization):
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64   App Store Connect API key
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag matches app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION (run scripts/set-version.sh)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        run: swift test

      - name: Prepare signing material
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS" && chmod 700 "$KEYS"
          # Pasted secrets often pick up line breaks or spaces; base64 never contains them.
          clean() { printf '%s' "$1" | tr -d ' \t\r\n'; }

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY is empty or missing."; exit 1
          fi
          clean "$SPARKLE_PRIVATE_KEY" > "$KEYS/sparkle_ed25519.key"
          if ! swift scripts/sparkle-keys.swift public "$KEYS/sparkle_ed25519.key" > "$KEYS/derived.pub" 2>/dev/null; then
            echo "::error::SPARKLE_PRIVATE_KEY is not a valid key. Paste the contents of ~/.xclose-release/sparkle_ed25519.key."; exit 1
          fi
          EXPECTED=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" Resources/Info.plist)
          if [ "$(cat "$KEYS/derived.pub")" != "$EXPECTED" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY does not match SUPublicEDKey in Info.plist; installed copies would reject the update."; exit 1
          fi
          echo "SPARKLE_KEY_FILE=$KEYS/sparkle_ed25519.key" >> "$GITHUB_ENV"

          if [ -z "$SIGNING_P12_BASE64" ]; then
            echo "::error::Secret SIGNING_P12_BASE64 is empty or missing."; exit 1
          fi
          if ! clean "$SIGNING_P12_BASE64" | base64 --decode > "$KEYS/signing.p12" 2>/dev/null || [ ! -s "$KEYS/signing.p12" ]; then
            echo "::error::SIGNING_P12_BASE64 is not valid base64. Recreate it with: base64 -i ~/.xclose-release/signing.p12 | pbcopy"; exit 1
          fi
          if [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "::error::Secret SIGNING_P12_PASSWORD is empty or missing."; exit 1
          fi
          # Check the password opens the certificate before the build needs it.
          CHECK_KC="$RUNNER_TEMP/check.keychain-db"
          security create-keychain -p check "$CHECK_KC"
          if ! security import "$KEYS/signing.p12" -k "$CHECK_KC" -P "$(clean "$SIGNING_P12_PASSWORD")" >/dev/null 2>&1; then
            security delete-keychain "$CHECK_KC"
            echo "::error::SIGNING_P12_PASSWORD does not open SIGNING_P12_BASE64. Use: cat ~/.xclose-release/signing.p12.password | pbcopy"; exit 1
          fi
          security delete-keychain "$CHECK_KC"
          echo "SIGNING_P12=$KEYS/signing.p12" >> "$GITHUB_ENV"
          echo "Signing material OK ($(wc -c < "$KEYS/signing.p12" | tr -d ' ') byte certificate, update key matches the app)."

          if [ -n "$NOTARY_KEY_P8_BASE64" ]; then
            clean "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEYS/notary.p8"
            echo "NOTARY_KEY_FILE=$KEYS/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SIGNING_P12_PASSWORD_RAW: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: SIGNING_P12_PASSWORD="$(printf '%s' "$SIGNING_P12_PASSWORD_RAW" | tr -d ' \t\r\n')" scripts/build-app.sh

      - name: Notarize app (Developer ID only)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$NOTARY_KEY_ID" ]; then scripts/notarize.sh dist/XClose.app; else echo "No notary credentials; skipping."; fi

      - name: Package
        run: scripts/package-release.sh

      - name: Notarize disk image (Developer ID only)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$NOTARY_KEY_ID" ]; then scripts/notarize.sh dist/XClose.dmg; else echo "No notary credentials; skipping."; fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/XClose.dmg "dist/XClose-$VERSION.zip" \
            --title "XClose $VERSION" --notes-file dist/release-notes.md

      - name: Add release to the update feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          python3 -I scripts/update-appcast.py dist/appcast-item.xml site/appcast.xml
          git add site/appcast.xml
          git commit -m "Appcast: XClose $VERSION"
          git push origin main

  website:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
